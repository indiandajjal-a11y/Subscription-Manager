name: subscription-manager-microservices

services:
  kafka:
    image: bitnami/kafka:3.7
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  zipkin:
    image: openzipkin/zipkin:3
    ports:
      - "9411:9411"

  catalog-db:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: catalog_db
      POSTGRES_USER: isp
      POSTGRES_PASSWORD: isp_secret

  cart-db:
    image: postgres:16-alpine
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: cart_db
      POSTGRES_USER: isp
      POSTGRES_PASSWORD: isp_secret

  order-db:
    image: postgres:16-alpine
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: isp
      POSTGRES_PASSWORD: isp_secret

  customer-db:
    image: postgres:16-alpine
    ports:
      - "5436:5432"
    environment:
      POSTGRES_DB: customer_db
      POSTGRES_USER: isp
      POSTGRES_PASSWORD: isp_secret

  notification-db:
    image: postgres:16-alpine
    ports:
      - "5437:5432"
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: isp
      POSTGRES_PASSWORD: isp_secret

  charging-db:
    image: postgres:16-alpine
    ports:
      - "5438:5432"
    environment:
      POSTGRES_DB: charging_db
      POSTGRES_USER: isp
      POSTGRES_PASSWORD: isp_secret

  inventory-db:
    image: postgres:16-alpine
    ports:
      - "5439:5432"
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: isp
      POSTGRES_PASSWORD: isp_secret

  channel-db:
    image: postgres:16-alpine
    ports:
      - "5440:5432"
    environment:
      POSTGRES_DB: channel_db
      POSTGRES_USER: isp
      POSTGRES_PASSWORD: isp_secret
